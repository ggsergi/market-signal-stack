indicator_rules:
  sopr_spent_output_profit_ratio:
    description: "Spent Output Profit Ratio (SOPR) measuring whether BTC spent on-chain is realized at profit or loss"
    layer: onchain_btc
    relevance_level: 1
    weight: 0.7
    calculation:
      formula: "sopr = value"
      frequency: "daily (calendar days)"
      # Real source: BGeometrics (free API), precomputed. It differs from the
      # original rule (Notion), which named Glassnode (indicators/sopr);
      # Glassnode is not in raw_market_metrics. SOPR can't be derived from the
      # raw layer (it needs spent-output data).
      source: "BGeometrics"
      series:
        - sopr  # metric 'btc_sopr' in raw_market_metrics (payload field 'sopr')
      notes: >
        Variant not confirmed (plain SOPR, adjusted aSOPR or short-term holder
        STH-SOPR): pending with Sara. History in the raw layer only from
        2022-11-26 (free-API window). Published with a ~7-day lag: a limitation
        of the BGeometrics FREE plan (confirmed by Sara 2026-11-26), not of our
        ingestion. It would disappear with a paid plan or a different source;
        we are not paying for data. SOPR is a short-term oscillator, so the lag
        reduces its usefulness: one reason it has the lowest weight (0.7).
        Spec: docs/specs/sopr_spent_output_profit_ratio.md.
    normalization:
      type: "threshold"
      unit: "ratio"
      # The original rule said 180; fixed thresholds on the raw daily value
      # need no window (decided).
      rolling_window: null
    # Original ranges converted to [min_inclusive, max_exclusive), like every
    # other rule. Values unchanged.
    thresholds:
      - min_inclusive: 1.05
        max_exclusive: null
        normalized_value: -0.6
        signal: "BEARISH"
        btc_bias: "negative"
        message: "El SOPR se sitúa claramente por encima de 1, indicando que el mercado está vendiendo BTC con beneficios, lo que históricamente suele preceder fases de distribución o correcciones."
      - min_inclusive: 1.00
        max_exclusive: 1.05
        normalized_value: -0.3
        signal: "BEARISH"
        btc_bias: "negative"
        message: "El SOPR se mantiene ligeramente por encima de 1, señalando realización de beneficios moderada y posible presión vendedora."
      - min_inclusive: 0.98
        max_exclusive: 1.00
        normalized_value: 0.0
        signal: "NEUTRAL"
        btc_bias: "neutral"
        message: "El SOPR se mueve cerca de 1, reflejando equilibrio entre ventas con beneficio y con pérdidas, típico de zonas de decisión del mercado."
      - min_inclusive: 0.90
        max_exclusive: 0.98
        normalized_value: 0.6
        signal: "BULLISH"
        btc_bias: "positive"
        message: "El SOPR se sitúa por debajo de 1, indicando ventas con pérdidas y posibles fases de capitulación o acumulación."
      - min_inclusive: null
        max_exclusive: 0.90
        normalized_value: 1.0
        signal: "BULLISH"
        btc_bias: "positive"
        message: "El SOPR está muy por debajo de 1, señalando capitulación intensa y zonas históricamente asociadas a suelos de mercado."
    missing_data:
      invalid_value: "if sopr is NULL or <= 0, everything is NULL"
      no_row: "no signal that day; no forward-fill in the indicator (carry-forward with expiry belongs to the layer mart)"
    freshness:
      # Per-indicator expiry in the layer mart (decided): ~7 days of observed
      # lag (BGeometrics free plan) plus margin. Read from a dedicated
      # BGeometrics freshness block in _sources.yml (to be created), not from
      # the 3-day daily block.
      max_age_days: 10
      # Fallback (documented, NOT implemented): if SOPR proves too stale to be
      # useful, exclude it from layer_signal and keep it only as an individual
      # indicator. Coverage without SOPR: 3.1 / 3.8 = 82 % (>= 70 %).
      fallback: "exclude from layer_signal, keep int_btc_sopr as an individual indicator"
