indicator_rules:
  btc_etf_net_flow:
    description: "Daily net flow into US spot bitcoin ETFs as a proxy for institutional demand for BTC"
    layer: crypto_liquidity
    relevance_level: null  # pendiente: no viene en la regla original
    weight: 1.3            # decidido aparte (no viene en la regla original)
    calculation:
      formula: "net_flow = total diario neto de todos los ETF spot de BTC de EE. UU. (columna Total de Farside), en millones de USD"
      frequency: "daily (US trading days)"
      source: "Farside Investors"
      series:
        - "farside.co.uk/bitcoin-etf-flow-all-data (Total)"
      notes: >
        Metric 'btc_etf_net_flow' en raw_market_metrics, 100 % BTC aunque asset sea
        NULL (no se filtra por asset). Solo se usa el total de todos los ETF.
        El ejemplo de la regla original ("15 enero 2024: +600M inflows") parece
        tener la fecha equivocada: el 2024-01-15 fue festivo en EE. UU. (Farside
        lo publica con 0) y los +655.3M son del 2024-01-11, primer día de
        cotización de los ETF spot.
    normalization:
      type: "threshold"
      unit: "usd_millions"
      rolling_window: null
    # Cada tramo es [min_inclusive, max_exclusive), como en el resto de reglas.
    # La regla original dice "> 200" y "> 100 de salidas"; con límite inferior
    # inclusivo el primero pasa a ">= 200". No hay ningún día con 200.0 ni
    # -100.0 exactos.
    # Texto del bot de la regla original: "El flujo diario de ETFs muestra una
    # señal {{positiva/negativa}}. Los ETFs son hoy el motor principal del precio
    # del BTC." La plantilla solo cubre positiva/negativa; para NEUTRAL se usa
    # "neutra" con el mismo texto (suposición).
    thresholds:
      - min_inclusive: 200
        max_exclusive: null
        normalized_value: 1.0
        signal: "BULLISH"
        btc_bias: "positive"
        message: "El flujo diario de ETFs muestra una señal positiva. Los ETFs son hoy el motor principal del precio del BTC."
      - min_inclusive: -100
        max_exclusive: 200
        normalized_value: 0.0
        signal: "NEUTRAL"
        btc_bias: "neutral"
        message: "El flujo diario de ETFs muestra una señal neutra. Los ETFs son hoy el motor principal del precio del BTC."
      - min_inclusive: null
        max_exclusive: -100
        normalized_value: -1.0
        signal: "BEARISH"
        btc_bias: "negative"
        message: "El flujo diario de ETFs muestra una señal negativa. Los ETFs son hoy el motor principal del precio del BTC."
    # "Inflows constantes varios días" / "varias sesiones seguidas de venta".
    # Solo actúa sobre días que por umbral serían NEUTRAL: un día >= 200 o
    # < -100 ya tiene su señal fuerte. Cuenta sesiones (filas), no días
    # naturales, y los festivos excluidos no rompen la racha.
    streak_rule:
      sessions: 5  # N
      inflow_streak:
        condition: "las últimas N sesiones (incluida la actual) con net_flow > 0"
        normalized_value: 0.6
        signal: "BULLISH"
        btc_bias: "positive"
        message: "El flujo diario de ETFs muestra una señal positiva. Los ETFs son hoy el motor principal del precio del BTC."
      outflow_streak:
        condition: "las últimas N sesiones (incluida la actual) con net_flow < 0"
        normalized_value: -0.6
        signal: "BEARISH"
        btc_bias: "negative"
        message: "El flujo diario de ETFs muestra una señal negativa. Los ETFs son hoy el motor principal del precio del BTC."
    missing_data:
      # Antes de 2025-07, Farside publica los festivos de EE. UU. con 0 en todas las
      # columnas (16 filas, p. ej. 2024-07-04, 2024-12-25, 2025-01-09); desde 2025-07
      # los festivos no tienen fila. Un 0 en esos días es "mercado cerrado", no
      # "flujo plano".
      market_closed_rows: "filas con net_flow = 0 se excluyen (no son sesión): sin fila en int_btc_etf_net_flow y no cuentan para la racha"
      no_row: "sin señal ese día; sin forward-fill en el indicador (el arrastre con caducidad es cosa del mart de capa)"
    future_improvements:
      - >
        Reglas por ETF de la regla original (IBIT/FBTC liderando compras, GBTC
        vendiendo más de lo que otros compran): descartadas en esta versión. El
        desglose existe en payload.etfs (12 ETF; su suma coincide con el total en
        las 717 filas), así que se pueden implementar más adelante.
      - >
        La regla original propone considerar también otros vehículos/exchanges
        ("ETF-All exchange") si crece el mercado de derivados en EE. UU.
