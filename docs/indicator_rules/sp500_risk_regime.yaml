indicator_rules:
  sp500_risk_regime:
    description: "S&P 500 price relative to its 200-day moving average as a proxy for global risk appetite"
    layer: macro
    relevance_level: 3
    weight: 1.1
    calculation:
      formula: "distance = (SPX_close_today / MA200_SPX) - 1"
      frequency: "daily"
      source: "Yahoo Finance"
      series:
        - "^GSPC"
      notes: "Distance to 200-day moving average used as a structural risk regime indicator."
    normalization:
      type: "threshold"
      unit: "percentage_distance"
      rolling_window: 200
    # Cada tramo es [min_inclusive, max_exclusive): el límite inferior incluye
    # ese valor exacto, el superior no. El primer tramo no tiene max_exclusive
    # (sin techo) y el último no tiene min_inclusive (sin suelo). Misma
    # semántica que el resto de indicadores.
    thresholds:
      - min_inclusive: 0.10
        max_exclusive: null
        normalized_value: 1.0
        signal: "BULLISH"
        btc_bias: "positive"
        message: "El S&P 500 cotiza muy por encima de su media de 200 días, indicando un entorno claramente alcista y favorable para activos de riesgo como BTC."
      - min_inclusive: 0.02
        max_exclusive: 0.10
        normalized_value: 0.6
        signal: "BULLISH"
        btc_bias: "positive"
        message: "El S&P 500 se mantiene por encima de su media de 200 días, reflejando un entorno risk-on favorable para BTC."
      - min_inclusive: -0.02
        max_exclusive: 0.02
        normalized_value: 0.0
        signal: "NEUTRAL"
        btc_bias: "neutral"
        message: "El S&P 500 se mueve cerca de su media de 200 días, mostrando un entorno de mercado sin una dirección clara para el riesgo."
      - min_inclusive: -0.10
        max_exclusive: -0.02
        normalized_value: -0.6
        signal: "BEARISH"
        btc_bias: "negative"
        message: "El S&P 500 cotiza por debajo de su media de 200 días, señalando un entorno risk-off que suele presionar a activos de riesgo como BTC."
      - min_inclusive: null
        max_exclusive: -0.10
        normalized_value: -1.0
        signal: "BEARISH"
        btc_bias: "negative"
        message: "El S&P 500 se encuentra muy por debajo de su media de 200 días, indicando un entorno claramente bajista y adverso para BTC."
