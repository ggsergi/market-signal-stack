indicator_rules:
  fed_balance_sheet_qe_qt:
    description: "FED balance sheet liquidity (QE / QT) using weekly changes in total assets (WALCL)"
    layer: macro
    relevance_level: 4
    weight: 1.3
    calculation:
      formula: "delta = WALCL_current - WALCL_previous"
      frequency: "weekly"
      source: "FRED"
      series:
        - WALCL
      notes: "Delta is calculated as the difference between consecutive weekly observations."
    normalization:
      type: "threshold"
      unit: "USD"
      rolling_window: null
    # Cada tramo es [min_inclusive, max_exclusive): el límite inferior incluye
    # ese valor exacto, el superior no. El primer tramo no tiene max_exclusive
    # (sin techo) y el último no tiene min_inclusive (sin suelo). Misma
    # semántica que docs/indicator_rules/yield_curve_10y_2y.yaml.
    thresholds:
      - min_inclusive: 20000000000
        max_exclusive: null
        normalized_value: 1.0
        signal: "BULLISH"
        btc_bias: "positive"
        message: "La FED está expandiendo su balance de forma agresiva (QE fuerte), inyectando liquidez significativa en el sistema y favoreciendo claramente activos de riesgo como BTC."
      - min_inclusive: 5000000000
        max_exclusive: 20000000000
        normalized_value: 0.6
        signal: "BULLISH"
        btc_bias: "positive"
        message: "La FED está expandiendo su balance (QE), aumentando la liquidez del sistema y apoyando el apetito por activos de riesgo como BTC."
      - min_inclusive: -5000000000
        max_exclusive: 5000000000
        normalized_value: 0.0
        signal: "NEUTRAL"
        btc_bias: "neutral"
        message: "El balance de la FED permanece relativamente estable, indicando una fase de transición o ausencia de cambios relevantes en la política monetaria."
      - min_inclusive: -20000000000
        max_exclusive: -5000000000
        normalized_value: -0.6
        signal: "BEARISH"
        btc_bias: "negative"
        message: "La FED está reduciendo su balance (QT), drenando liquidez del sistema y generando presión bajista sobre activos de riesgo como BTC."
      - min_inclusive: null
        max_exclusive: -20000000000
        normalized_value: -1.0
        signal: "BEARISH"
        btc_bias: "negative"
        message: "La FED está ejecutando un QT agresivo, retirando liquidez de forma significativa y creando un entorno macroeconómico claramente adverso para BTC."
