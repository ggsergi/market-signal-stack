version: 2

models:
  - name: int_btc_rhodl_ratio
    description: >
      Indicator rhodl_ratio_btc: Bitcoin RHODL Ratio precomputed by
      BGeometrics (payload field rhodlRatio), raw daily value with no
      smoothing, one row per calendar day from 2022-11-26 (free-API window).
      PROVISIONAL bands: outer bands from LookIntoBitcoin's chart zones
      (>= 22,000 and < 350), middle bands ASSUMED; calibrated on
      LookIntoBitcoin and applied to BGeometrics, valid at cycle scale only.
      NULL when the value is missing or not positive. Layer onchain_btc,
      relevance_level 3, weight 1.1. Rules in
      docs/indicator_rules/rhodl_ratio_btc.yaml; spec in
      docs/specs/rhodl_ratio_btc.md.
    config:
      meta:
        indicator_id: rhodl_ratio_btc
        layer: onchain_btc
        relevance_level: 3
        weight: 1.1
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(signal IS NULL) = (rhodl IS NULL)"
    columns:
      - name: event_time
        data_type: TIMESTAMP
        tests:
          - unique
          - not_null
      - name: rhodl
        data_type: FLOAT64
        description: "BGeometrics RHODL Ratio (metric 'btc_rhodl_ratio', payload field 'rhodlRatio'). NULL if missing or <= 0."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: normalized_value
        data_type: FLOAT64
        description: "-1.0 / -0.6 / 0.0 / 0.6 / 1.0 (the -0.6, 0.0 and +0.6 bands are ASSUMED). NULL when rhodl is NULL."
      - name: signal
        data_type: STRING
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: btc_bias
        data_type: STRING
        tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
      - name: message
        data_type: STRING
        description: "Bot text for the band, from the rule (Spanish). NULL when rhodl is NULL."

unit_tests:
  # Band edges (lower bound inclusive) and the NULL cases.
  - name: btc_rhodl_ratio_band_edges_and_nulls
    model: int_btc_rhodl_ratio
    given:
      - input: ref('stg_market_metrics')
        format: sql
        rows: |
          SELECT 'btc_rhodl_ratio' AS metric, CAST(22000 AS FLOAT64) AS value, TIMESTAMP '2024-01-01' AS event_time UNION ALL
          SELECT 'btc_rhodl_ratio', 5000.0, TIMESTAMP '2024-01-02' UNION ALL
          SELECT 'btc_rhodl_ratio', 1000.0, TIMESTAMP '2024-01-03' UNION ALL
          SELECT 'btc_rhodl_ratio', 350.0, TIMESTAMP '2024-01-04' UNION ALL
          SELECT 'btc_rhodl_ratio', 349.99, TIMESTAMP '2024-01-05' UNION ALL
          SELECT 'btc_rhodl_ratio', 0.0, TIMESTAMP '2024-01-06' UNION ALL
          SELECT 'btc_rhodl_ratio', CAST(NULL AS FLOAT64), TIMESTAMP '2024-01-07' UNION ALL
          SELECT 'btc_sopr', 1.0, TIMESTAMP '2024-01-01'
    expect:
      rows:
        - {event_time: 2024-01-01 00:00:00, normalized_value: -1.0, signal: BEARISH, btc_bias: negative}
        - {event_time: 2024-01-02 00:00:00, normalized_value: -0.6, signal: BEARISH, btc_bias: negative}
        - {event_time: 2024-01-03 00:00:00, normalized_value: 0.0, signal: NEUTRAL, btc_bias: neutral}
        - {event_time: 2024-01-04 00:00:00, normalized_value: 0.6, signal: BULLISH, btc_bias: positive}
        - {event_time: 2024-01-05 00:00:00, normalized_value: 1.0, signal: BULLISH, btc_bias: positive}
        - {event_time: 2024-01-06 00:00:00, normalized_value: null, signal: null, btc_bias: null}
        - {event_time: 2024-01-07 00:00:00, normalized_value: null, signal: null, btc_bias: null}
