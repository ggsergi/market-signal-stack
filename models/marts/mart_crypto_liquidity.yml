version: 2

models:
  - name: mart_crypto_liquidity
    description: >
      Capa de liquidez cripto: una fila por día natural con la señal de cada
      indicador de la capa (signal_<indicador>) y la fecha de la observación
      usada (<indicador>_as_of). Cada día toma la última observación del
      indicador si no supera su caducidad (error_after del bloque de freshness
      diario en _sources.yml, 3 días); si la supera, ambas columnas quedan en
      NULL. Calendario: del primer día con alguna señal a la última fecha con
      observaciones. layer_signal pendiente de definir.
    config:
      access: public
      contract:
        enforced: true
      grants:
        # El principal real vive en la variable de entorno
        # SARA_MARTS_READER_PRINCIPAL (no versionada) para no exponer el
        # nombre real de la cuenta de servicio en un repo público. El valor
        # por defecto es solo un placeholder ilustrativo.
        roles/bigquery.dataViewer: ["{{ env_var('SARA_MARTS_READER_PRINCIPAL', 'serviceAccount:sara-marts-reader@your-gcp-project.iam.gserviceaccount.com') }}"]
      meta:
        layer: crypto_liquidity
    columns:
      - name: signal_date
        data_type: DATE
        tests:
          - unique
          - not_null
      - name: signal_btc_etf_net_flow
        data_type: STRING
        description: >
          Señal de int_btc_etf_net_flow vigente ese día (arrastre as-of con caducidad).
          NULL antes de la primera sesión (2024-01-11) y si la última sesión tiene más de 3 días (p. ej. cierres largos del mercado de EE. UU.).
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: signal_btc_exchange_net_flow
        data_type: STRING
        description: >
          Señal de int_btc_exchange_net_flow vigente ese día (arrastre as-of con caducidad).
          NULL si la última observación tiene más de 3 días, o si la del día tiene net_flow NULL (falta inflow u outflow, o ambos son 0).
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: btc_etf_net_flow_as_of
        data_type: DATE
        description: "Fecha de la observación de int_btc_etf_net_flow usada para signal_btc_etf_net_flow. NULL si caducada o sin observación previa."
      - name: btc_exchange_net_flow_as_of
        data_type: DATE
        description: "Fecha de la observación de int_btc_exchange_net_flow usada para signal_btc_exchange_net_flow. NULL si caducada o sin observación previa."
