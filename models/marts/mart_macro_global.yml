version: 2

models:
  - name: mart_macro_global
    description: >
      Capa macro global: una fila por día natural con la señal de cada uno de
      los 10 indicadores macro (signal_<indicador>) y la fecha de la
      observación usada (<indicador>_as_of). Cada día toma la última
      observación del indicador si no supera su caducidad (error_after del
      bloque de freshness de su cadencia en _sources.yml); si la supera, ambas
      columnas quedan en NULL. Calendario: del primer día con alguna señal a la
      última fecha con observaciones. layer_signal pendiente de definir.
    config:
      access: public
      contract:
        enforced: true
      grants:
        # El principal real vive en la variable de entorno
        # SARA_MARTS_READER_PRINCIPAL (no versionada) para no exponer el
        # nombre real de la cuenta de servicio en un repo público. El valor
        # por defecto es solo un placeholder ilustrativo.
        roles/bigquery.dataViewer: ["{{ env_var('SARA_MARTS_READER_PRINCIPAL', 'serviceAccount:sara-marts-reader@your-gcp-project.iam.gserviceaccount.com') }}"]
      meta:
        layer: macro
    columns:
      - name: signal_date
        data_type: DATE
        tests:
          - unique
          - not_null
      - name: signal_yield_curve
        data_type: STRING
        description: >
          Señal de int_yield_curve vigente ese día (arrastre as-of con caducidad).
          NULL si no hay observación dentro de la caducidad, o si la última
          observación tiene signal NULL (ventana del indicador incompleta).
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: signal_fed_balance_sheet
        data_type: STRING
        description: >
          Señal de int_fed_balance_sheet vigente ese día (arrastre as-of con caducidad).
          NULL si no hay observación dentro de la caducidad, o si la última
          observación tiene signal NULL (ventana del indicador incompleta).
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: signal_dxy
        data_type: STRING
        description: >
          Señal de int_dxy vigente ese día (arrastre as-of con caducidad).
          NULL si no hay observación dentro de la caducidad, o si la última
          observación tiene signal NULL (ventana del indicador incompleta).
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: signal_vix
        data_type: STRING
        description: >
          Señal de int_vix vigente ese día (arrastre as-of con caducidad).
          NULL si no hay observación dentro de la caducidad, o si la última
          observación tiene signal NULL (ventana del indicador incompleta).
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: signal_spx
        data_type: STRING
        description: >
          Señal de int_spx vigente ese día (arrastre as-of con caducidad).
          NULL si no hay observación dentro de la caducidad, o si la última
          observación tiene signal NULL (ventana del indicador incompleta).
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: signal_nasdaq_tech_risk
        data_type: STRING
        description: >
          Señal de int_nasdaq_tech_risk vigente ese día (arrastre as-of con caducidad).
          NULL si no hay observación dentro de la caducidad, o si la última
          observación tiene signal NULL (ventana del indicador incompleta).
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: signal_move
        data_type: STRING
