version: 2

models:
  - name: mart_usa_m2
    description: >
      Indicador usa_m2_money_supply: percentil del crecimiento interanual del
      M2 de EE.UU. (FRED M2SL, mensual) dentro de sus últimos 240 meses, como
      proxy de las condiciones de liquidez doméstica y global. Layer macro,
      relevance_level 3, weight 1.1. Reglas en
      docs/indicator_rules/usa_m2_money_supply.yaml.
    config:
      access: public
      contract:
        enforced: true
      grants:
        # El principal real vive en la variable de entorno
        # SARA_MARTS_READER_PRINCIPAL (no versionada) para no exponer el
        # nombre real de la cuenta de servicio en un repo público. El valor
        # por defecto es solo un placeholder ilustrativo.
        roles/bigquery.dataViewer: ["{{ env_var('SARA_MARTS_READER_PRINCIPAL', 'serviceAccount:sara-marts-reader@your-gcp-project.iam.gserviceaccount.com') }}"]
      meta:
        indicator_id: usa_m2_money_supply
        layer: macro
        relevance_level: 3
        weight: 1.1
    columns:
      - name: event_time
        data_type: TIMESTAMP
        tests:
          - unique
          - not_null
      - name: value
        data_type: FLOAT64
        description: "Nivel de M2 de EE.UU. en miles de millones de USD (metric 'm2_usa')."
      - name: m2_yoy
        data_type: FLOAT64
        description: "(M2 / M2 de hace 12 meses) - 1, como fracción. NULL en los primeros 12 meses."
      - name: yoy_percentile
        data_type: FLOAT64
        description: >
          Fracción de las últimas 240 observaciones de m2_yoy (incluida la
          actual) que son <= a la actual, en [0, 1]. NULL hasta completar la
          ventana (mes 252 de la serie); el not_null a partir de ahí lo cubre
          tests/assert_usa_m2_not_null_after_window.sql.
      - name: normalized_value
        data_type: FLOAT64
      - name: signal
        data_type: STRING
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
      - name: btc_bias
        data_type: STRING
        tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
      - name: message
        data_type: STRING
