version: 2

models:
  - name: mart_yield_curve
    config:
      access: public
      contract:
        enforced: true
      grants:
        roles/bigquery.dataViewer: ['serviceAccount:sara-marts-reader@market-signal-stack.iam.gserviceaccount.com']
    columns:
      - name: event_time
        data_type: TIMESTAMP
        tests:
          - unique
          - not_null
      - name: dgs2
        data_type: FLOAT64
      - name: dgs10
        data_type: FLOAT64
      - name: is_dgs2_imputed
        data_type: BOOL
      - name: is_dgs10_imputed
        data_type: BOOL
      - name: raw_diff
        data_type: FLOAT64
        tests:
          - not_null
      - name: normalized_value
        data_type: FLOAT64
      - name: signal
        data_type: STRING
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'NEUTRAL', 'BEARISH']
